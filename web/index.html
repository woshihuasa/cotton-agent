<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棉花智能问答助手</title>
<!-- Markdown 渲染（可选）：加载失败时退化为纯文本显示 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   样式规范：与桌面端（ui/main_window.py 的 QSS、ui/sidebar.py）保持一致
     主背景 #F7F7F8 ｜ 侧栏 #F0F0F0 ｜ 用户气泡 #D8D8D8 ｜ AI 气泡透明
     输入框 #FFFFFF 圆角 15px ｜ 发送键 #000000 32×32 圆角 12px
     强调色 #0066CC ｜ 正文 14px ｜ 控件 13px
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#F7F7F8; --sidebar:#F0F0F0; --hover:#E0E0E0; --pressed:#D0D0D0;
  --border:#E0E0E0; --text:#1f1f1f; --text2:#333333;
  --user-bubble:#D8D8D8; --input-bg:#FFFFFF;
  --accent:#0066CC; --accent-bg:#E6F0FF;
  --send:#000000; --panel:#F5F5F5; --code-bg:#F6F8FA; --inline-code:#F0F0F0;
  --sidebar-w:260px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:14px; display:flex; overflow:hidden;
}

/* ── 侧栏（260px，与桌面端一致）── */
#sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w); height:100%;
  background:var(--sidebar); display:flex; flex-direction:column;
  transition:margin-left .18s ease;
}
#sidebar.hidden{margin-left:calc(-1 * var(--sidebar-w))}
#newChat{
  margin:12px; padding:9px 12px; font-size:13px; color:var(--text2);
  background:#fff; border:1px solid var(--border); border-radius:8px; cursor:pointer;
}
#newChat:hover{background:var(--hover)}
#sessionList{flex:1; overflow-y:auto; padding:0 8px}
#sessionList::-webkit-scrollbar{width:6px}
#sessionList::-webkit-scrollbar-thumb{background:#C0C0C0;border-radius:3px}
.session{
  padding:9px 10px; margin-bottom:4px; border-radius:8px; font-size:13px;
  color:var(--text2); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.session:hover{background:var(--hover)}
.session.active{background:var(--pressed);color:var(--text)}
#sidebarFoot{padding:10px 12px;border-top:1px solid var(--border)}

/* ── 主区 ── */
#main{flex:1; display:flex; flex-direction:column; height:100%; min-width:0}
#topbar{
  display:flex; align-items:center; gap:10px; padding:10px 16px;
  border-bottom:1px solid var(--border); background:var(--bg);
}
#toggleBtn{
  width:28px;height:28px;border:none;background:transparent;border-radius:4px;
  cursor:pointer;color:var(--text2);font-size:15px;line-height:1;
}
#toggleBtn:hover{background:var(--hover)}
#title{font-size:14px;color:var(--text2);flex:1;text-align:center}
.chip{
  background:var(--inline-code); border:1px solid var(--inline-code);
  border-radius:12px; padding:4px 10px; font-size:13px; color:var(--text2); cursor:pointer;
}
.chip:hover{border-color:#D0D0D0;background:#E8E8E8}
.chip.on{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--accent)}

/* ── 消息区 ── */
#messages{flex:1; overflow-y:auto; padding:18px 0 8px}
#messages::-webkit-scrollbar{width:8px}
#messages::-webkit-scrollbar-thumb{background:rgba(0,0,0,.10);border-radius:4px}
#messages::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.30)}
.row{display:flex; padding:6px 28px}
.row.user{justify-content:flex-end}
.bubble{max-width:78%; line-height:1.65; word-break:break-word}
.row.user .bubble{
  background:var(--user-bubble); border-radius:12px; padding:9px 13px;
}
.row.ai .bubble{background:transparent;padding:4px 0;min-width:0}
/* 回答内的富文本（与桌面端 QSS 对齐） */
.bubble table{border-collapse:collapse;width:100%;margin:6px 0;font-size:13px}
.bubble th,.bubble td{border:1px solid #DDDDDD;padding:6px}
.bubble code{
  background:var(--inline-code);padding:2px 4px;border-radius:4px;
  font-family:Consolas,monospace;font-size:13px;
}
.bubble pre{
  background:var(--code-bg);padding:10px;border-radius:6px;
  border:1px solid var(--border);overflow-x:auto;margin:6px 0;
}
.bubble pre code{background:transparent;padding:0}
.bubble img{max-width:100%;border-radius:8px;border:1px solid var(--border);margin:6px 0}
.bubble ul,.bubble ol{padding-left:22px;margin:4px 0}
.bubble h1,.bubble h2,.bubble h3{font-size:14px;margin:8px 0 4px}
.bubble a{color:var(--accent)}
/* 思考面板（桌面端 #F5F5F5 / 8px） */
.think{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:8px 11px;margin-bottom:8px;font-size:13px;color:#666;white-space:pre-wrap;
}
.think summary{cursor:pointer;color:var(--text2);font-size:13px}
.err{color:#C0392B;font-size:13px}

/* ── 输入区（白色圆角胶囊 + 黑色圆形发送键）── */
#inputWrap{padding:8px 28px 18px}
#inputFrame{
  display:flex; align-items:flex-end; gap:8px;
  background:var(--input-bg); border:1px solid var(--border);
  border-radius:15px; padding:6px 8px 6px 6px;
}
#input{
  flex:1; border:none; outline:none; resize:none; background:transparent;
  font-size:14px; color:var(--text); line-height:1.5;
  padding:8px 8px 8px 10px; max-height:160px; font-family:inherit;
}
#input::placeholder{color:#9a9a9a}
#send{
  width:32px;height:32px;flex:0 0 32px;border:none;border-radius:12px;
  background:var(--send); cursor:pointer; display:flex;
  align-items:center;justify-content:center;
}
#send:hover{background:#333333}
#send:active{background:#555555}
#send:disabled{background:#BBBBBB;cursor:default}
#send svg{width:16px;height:16px}

/* ── Key 设置弹窗 ── */
#modal{
  position:fixed; inset:0; background:rgba(0,0,0,.35); display:none;
  align-items:center; justify-content:center; z-index:20;
}
#modal.show{display:flex}
#modalCard{
  width:min(420px,90vw); background:#fff; border-radius:12px; padding:20px 22px;
  box-shadow:0 8px 28px rgba(0,0,0,.16);
}
#modalCard h3{font-size:15px;margin-bottom:10px}
#modalCard p{font-size:13px;color:#666;line-height:1.7;margin-bottom:12px}
#keyInput{
  width:100%;padding:9px 11px;font-size:13px;border:1px solid var(--border);
  border-radius:8px;outline:none;font-family:Consolas,monospace;
}
#keyInput:focus{border-color:var(--accent)}
#tokenRow{margin-top:10px}
#tokenInput{
  width:100%;padding:9px 11px;font-size:13px;border:1px solid var(--border);
  border-radius:8px;outline:none;font-family:Consolas,monospace;
}
#tokenInput:focus{border-color:var(--accent)}
#modalBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#modalBtns button{
  padding:7px 16px;font-size:13px;border-radius:8px;cursor:pointer;
  border:1px solid var(--border);background:#fff;color:var(--text2);
}
#modalBtns button.primary{background:var(--send);color:#fff;border-color:var(--send)}
#modalBtns button.primary:hover{background:#333}
#empty{color:#9a9a9a;font-size:13px;text-align:center;padding:48px 20px;line-height:2}
</style>
</head>
<body>

<!-- 侧栏：260px，与桌面端一致 -->
<aside id="sidebar">
  <button id="newChat">＋ 新建对话</button>
  <div id="sessionList"></div>
  <div id="sidebarFoot">
    <button class="chip" id="settingsBtn" style="width:100%">⚙ DeepSeek Key 设置</button>
  </div>
</aside>

<!-- 主区 -->
<main id="main">
  <div id="topbar">
    <button id="toggleBtn" title="收起/展开侧栏">☰</button>
    <div id="title">棉花智能问答助手</div>
    <button class="chip" id="thinkChip" title="开启后显示模型思考过程">深度思考</button>
  </div>

  <div id="messages">
    <div id="empty">问点什么吧，例如：<br>
      「2022 年棉花产量前五的地区」<br>
      「花铃期土壤含水量低于多少要浇水」<br>
      「对比喀什和阿克苏 2022 年产量并画图」
    </div>
  </div>

  <div id="inputWrap">
    <div id="inputFrame">
      <textarea id="input" rows="1" placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send" title="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>
</main>

<!-- Key 设置弹窗 -->
<div id="modal">
  <div id="modalCard">
    <h3>连接设置</h3>
    <p>你自备的 Key 只保存在**本浏览器本地**，随每次提问发送给本机服务，
       服务端不会保存或落盘。<br>
       知识库检索（Embedding）由服务端配置提供，无需在此填写。</p>
    <input id="keyInput" type="password" placeholder="DeepSeek Key：sk-..." autocomplete="off">
    <div id="tokenRow">
      <input id="tokenInput" type="password" placeholder="访问口令（服务端开启时必填）" autocomplete="off">
    </div>
    <div id="modalBtns">
      <button id="keyCancel">取消</button>
      <button id="keySave" class="primary">保存</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  状态
// ══════════════════════════════════════════
const LS_KEY = 'cotton_ds_key';
const LS_TOKEN = 'cotton_access_token';
const LS_SESSIONS = 'cotton_sessions';
let sessions = [];          // [{id, title}]
let currentId = null;
let thinking = false;
let sending = false;
let tokenRequired = false;  // 服务端是否开启访问口令（由 /health 探测）

const $ = (id) => document.getElementById(id);
const msgsEl = $('messages');

// ══════════════════════════════════════════
//  Key（自备）：存浏览器本地，随请求头发送
// ══════════════════════════════════════════
const getKey = () => localStorage.getItem(LS_KEY) || '';
function setKey(v) { v ? localStorage.setItem(LS_KEY, v) : localStorage.removeItem(LS_KEY); }

// 访问口令（服务端 .env 配了 WEB_ACCESS_TOKEN 才需要）
const getToken = () => localStorage.getItem(LS_TOKEN) || '';
function setToken(v) { v ? localStorage.setItem(LS_TOKEN, v) : localStorage.removeItem(LS_TOKEN); }

function openSettings() {
  $('keyInput').value = getKey();
  $('tokenInput').value = getToken();
  $('tokenRow').style.display = tokenRequired ? 'block' : 'none';
  $('modal').classList.add('show');
}

$('settingsBtn').onclick = openSettings;
$('keyCancel').onclick = () => $('modal').classList.remove('show');
$('keySave').onclick = () => {
  setKey($('keyInput').value.trim());
  setToken($('tokenInput').value.trim());
  $('modal').classList.remove('show');
};
$('modal').onclick = (e) => { if (e.target.id === 'modal') $('modal').classList.remove('show'); };

// ══════════════════════════════════════════
//  会话列表（存 localStorage；引擎在服务端按 session_id 隔离）
// ══════════════════════════════════════════
function loadSessions() {
  try { sessions = JSON.parse(localStorage.getItem(LS_SESSIONS) || '[]'); } catch (e) { sessions = []; }
  currentId = sessions[0]?.id || null;
  renderSessions();
}
function saveSessions() { localStorage.setItem(LS_SESSIONS, JSON.stringify(sessions)); }

function renderSessions() {
  const box = $('sessionList');
  box.innerHTML = '';
  sessions.forEach(s => {
    const d = document.createElement('div');
    d.className = 'session' + (s.id === currentId ? ' active' : '');
    d.textContent = s.title || '新对话';
    d.onclick = () => { currentId = s.id; renderSessions(); clearMessages(); };
    box.appendChild(d);
  });
}

async function newSession() {
  const r = await fetch('/session', { method: 'POST' }).then(r => r.json()).catch(() => null);
  const id = r?.session_id || (Date.now().toString(36) + Math.random().toString(36).slice(2));
  sessions.unshift({ id, title: '新对话' });
  currentId = id;
  saveSessions(); renderSessions(); clearMessages();
  $('input').focus();
}

$('newChat').onclick = newSession;
$('toggleBtn').onclick = () => $('sidebar').classList.toggle('hidden');
$('thinkChip').onclick = () => {
  thinking = !thinking;
  $('thinkChip').classList.toggle('on', thinking);
};

// ══════════════════════════════════════════
//  消息渲染
// ══════════════════════════════════════════
function clearMessages() { msgsEl.innerHTML = ''; }

function addRow(role) {
  const empty = $('empty');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  row.appendChild(bubble);
  msgsEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

function scrollToBottom() { msgsEl.scrollTop = msgsEl.scrollHeight; }

function renderMarkdown(text) {
  if (window.marked) {
    try { return marked.parse(text, { breaks: true }); } catch (e) { /* 退化为纯文本 */ }
  }
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

// ══════════════════════════════════════════
//  发送：fetch + ReadableStream 读 SSE
//  （EventSource 只支持 GET 且无法自定义请求头，故用 fetch 流式读取）
// ══════════════════════════════════════════
async function send() {
  const input = $('input');
  const q = input.value.trim();
  if (!q || sending) return;

  const key = getKey();
  if (!key) { $('modal').classList.add('show'); return; }
  if (!currentId) await newSession();

  sending = true;
  $('send').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addRow('user').textContent = q;
  const aiBubble = addRow('ai');
  let answer = '';
  let thinkEl = null;

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-DeepSeek-Key': key,
        'X-Access-Token': getToken(),
      },
      body: JSON.stringify({ session_id: currentId, question: q, thinking })
    });
    if (!resp.ok) {
      // 401 = 口令缺失/错误；429 = 触发限流。后端均返回 {"detail": "..."}
      let detail = 'HTTP ' + resp.status;
      try { detail = (await resp.json()).detail || detail; } catch (e) { /* 用默认文案 */ }
      if (resp.status === 401) openSettings();      // 直接把设置面板弹出来
      throw new Error(detail);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!raw.startsWith('data: ')) continue;
        let msg;
        try { msg = JSON.parse(raw.slice(6)); } catch (e) { continue; }

        if (msg.type === 'content') {
          answer += msg.data;
          aiBubble.innerHTML = renderMarkdown(answer);
          scrollToBottom();
        } else if (msg.type === 'reasoning') {
          if (!thinkEl) {
            thinkEl = document.createElement('details');
            thinkEl.className = 'think';
            thinkEl.open = true;
            thinkEl.innerHTML = '<summary>思考过程</summary><div></div>';
            aiBubble.parentElement.insertBefore(thinkEl, aiBubble);
          }
          thinkEl.querySelector('div').textContent += msg.data;
          scrollToBottom();
        } else if (msg.type === 'error') {
          aiBubble.innerHTML = '<span class="err">' + msg.data + '</span>';
        }
      }
    }
  } catch (e) {
    aiBubble.innerHTML = '<span class="err">请求失败：' + e.message + '</span>';
  } finally {
    if (thinkEl) thinkEl.open = false;
    sending = false;
    $('send').disabled = false;
    $('input').focus();
    // 首轮回答后更新会话标题
    const cur = sessions.find(s => s.id === currentId);
    if (cur && (cur.title === '新对话' || !cur.title) && answer) {
      cur.title = q.length > 14 ? q.slice(0, 14) + '…' : q;
      saveSessions(); renderSessions();
    }
  }
}

$('send').onclick = send;
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

// ══════════════════════════════════════════
//  启动
// ══════════════════════════════════════════
loadSessions();
if (!currentId) newSession();

// 探测服务端是否开启访问口令：开启且本地未存口令 → 直接弹出设置面板
(async () => {
  try {
    const h = await fetch('/health').then(r => r.json());
    tokenRequired = !!h.token_required;
    if (tokenRequired && !getToken()) openSettings();
  } catch (e) { /* 探测失败不影响正常使用 */ }
})();

$('input').focus();
</script>
</body>
</html>
