# 每日棉花价格 —— 由触发层在每天收盘后拉起（`core/schedule.py`）
#
# 【为什么是一条只有单个节点的工作流】
#   这条推送**不需要模型**：三个口径的数字与涨跌都是现成的，让模型复述一遍
#   只会多一次调用、多一种说错的可能。工作流在这里的作用是"登记口径"——
#   取哪几个数、从哪来、失败了怎么办，写在 YAML 里可 review。
#
# 【失败即失败】`get_cotton_index` 解析不到就返回 `{"error": ...}`，
#   工具节点据此判失败（`engine._exec_tool`），整条推送不会发出。
#   宁可今天没有价格消息，也不要发一条缺数或错数的。
#
# 【三个口径不要混】全国 CC Index 3128B 与新疆指数 3128B 常年差几百元/吨，
#   郑棉期货是盘面价。混用会得出"涨还是跌"完全相反的结论。
id: price_brief
version: 1
description: 当日棉花价格（全国指数 / 疆内指数 / 郑棉期货）→ 推送到抽屉
inputs: {}

nodes:
  # 唯一节点：取数并拼好三行文字（工具返回 JSON，`summary` 字段就是要推的正文）
  - id: index
    type: tool.get_cotton_index
    params: {}
    side_effect: network