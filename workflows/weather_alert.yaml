# 极端天气预警 —— 官方预警信号命中后由触发层拉起（`core/schedule.py`）
#
# 【这条工作流的职责】
#   气象台已经**判定并发布了**预警（蓝色/黄色/橙色/红色），这一级不由我们算。
#   工作流要做的只有三件事：
#
#     ① 拿到**定量**的次日预报（温度、风力、降水量）—— 官方信号是定性的
#        （"大风蓝色预警"），而农事建议必须说清"多大风、什么时候、能不能作业"；
#     ② 按**信号主题**去知识库找处置措施（知识库里是散文，没有数字，
#        所以检索用农事动作词，不用读数）；
#     ③ 把「信号 + 读数 + 措施」写成一段农户能照着做的话。
#
# 【为什么检索用 alarm_topic 而不是 alarm 原文】
#   原文是「- 大风：白天风力 6」这种带数字的句子。知识库里没有数字，
#   用数字去检索散文会跑偏。所以触发层把它翻成主题词
#   （`core/alarms.py::topic_keywords`），例如「防风 压膜 化控 喷药」。
#   数字仍然交给模型，只是不进检索。
#
# 【检索为空不算失败】
#   `optional: true` —— 极端天气是低频事件，库里恰好没有"沙尘暴"专题很正常。
#   宁可拿读数与通用措施写一条，也不该让整条预警发不出去。
id: weather_alert
version: 1
description: 官方预警信号 → 次日定量预报 → 知识库措施 → 一段提前处置建议

inputs:
  city:        { type: string, required: true,  description: 城市名（高德口径） }
  region:      { type: string, required: true,  description: 地区名 }
  alarm:       { type: string, required: true,  description: 官方预警信号原文（触发层给出） }
  alarm_topic: { type: string, required: true,  description: 检索主题词（信号类型 → 农事动作） }

nodes:
  # ① 定量读数。★ 再取一次天气是为了让建议里有原始数字（温度/风力/降水），
  #    而不是只转述一句"大风蓝色预警"。
  - id: weather
    type: tool.get_weather
    params:
      city: "{{city}}"
      date: tomorrow
    side_effect: network

  # ② 措施依据。query 由「地区 + 棉花 + 信号主题词」组成，不带数字。
  - id: tips
    type: data.kb_query
    params:
      query: "{{region}} 棉花 {{alarm_topic}}"
      top_k: 3
      optional: true
    side_effect: none

  # ③ 成文。prompt 里用 {{alarm}} 引用官方原文（占位符由引擎按输入名替换）。
  - id: advice
    type: llm.summarize
    params:
      prompt_ref: prompts/weather_alert.md
      inputs: [weather, tips]
      output_schema:
        title: string
        body: string
    side_effect: network
    needs: [weather, tips]