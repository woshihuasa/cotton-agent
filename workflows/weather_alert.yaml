# 极端天气预警 —— 官方信号 + 未来数小时的定量描述 → 农事建议
#
# 【三段式，责任分开】
#   给用户的内容分成三段，前两段**由代码拼、模型碰不到**，第三段才交给模型：
#
#     ① 预警等级      ← 官方原文（蓝色/黄色/橙色/红色），不接受模型改写
#     ② 未来数小时的气象 ← 官方详情正文里的定量描述（"未来 24 小时内……阵风 7-8 级"）
#     ③ 农事建议      ← 模型依据 ② 与知识库摘录写成
#
# 【为什么不再取"次日预报"】
#   预警讲的是**未来数小时到一天内**的事（大风蓝色 24 小时、雷雨大风黄色 6 小时），
#   而次日预报讲的是"明天白天怎么样" —— 两个时间窗对不上，拿后者去解释前者会写出
#   自相矛盾的建议。定量的时效与量级**已经写在预警正文里**，不需要另找数据源。
#
# 【为什么标题不由模型写】
#   等级是事实。让模型写标题，就有机会把"蓝色"写成"较强"甚至升成"橙色"。
#   所以标题由触发层用官方字段拼，模型只写建议正文。
id: weather_alert
version: 1
description: 官方预警（等级 + 未来数小时定量描述）→ 知识库措施 → 农事建议

inputs:
  city:            { type: string, required: true,  description: 城市名（高德口径） }
  region:          { type: string, required: true,  description: 地区名 }
  alarm:           { type: string, required: true,  description: 预警原文（含未来时效与量级） }
  alarm_level:     { type: string, required: true,  description: 官方等级：蓝色/黄色/橙色/红色 }
  alarm_window:    { type: string, required: false, description: 时效，如「24小时」（从原文读） }
  alarm_topic:     { type: string, required: true,  description: 检索主题词（信号 → 农事动作） }
  official_advice: { type: string, required: false, description: 官方防御指南（只作参考） }

nodes:
  # ① 措施依据：query = 地区 + 棉花 + 信号主题词（不带数字，知识库里是散文）
  - id: tips
    type: data.kb_query
    params:
      query: "{{region}} 棉花 {{alarm_topic}}"
      top_k: 3
      optional: true
    side_effect: none

  # ② 成文：**只写农事建议**，等级与气象描述由触发层前置（模型不重复、不改写）
  - id: advice
    type: llm.summarize
    params:
      prompt_ref: prompts/weather_alert.md
      inputs: [tips]
      output_schema:
        body: string
    side_effect: network
    needs: [tips]