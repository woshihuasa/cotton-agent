# 每日农情简报 —— 每天清晨由触发层拉起（`core/schedule.py`）
#
# 【三段式，与预警同构】
#   · 今日 / 明日 / 后天 各一行天气 —— **触发层预取**，模型碰不到、不能改；
#   · 农事建议 —— 模型写，**可以引用**那几行的数字，但一个字都不许改。
#
# 【为什么天气由触发层取、再当输入传进来】
#   这几行**同时**是给用户看的客观块和给模型的依据。若让工作流自己调天气工具，
#   触发层就拿不到它、拼不出客观块，推送又会退回"只有模型正文"那种没法核对的形态。
#   预警那条链路已经是这个做法（触发层给事实，模型只写建议），这里保持一致。
#
# 【为什么去掉 title / actions】
#   `title` 从来没被用过（推送标题一直取任务名）；`actions` 也从未被渲染 ——
#   契约里留两个没人消费的字段，只会让人以为"有这功能"。现在只剩 body。
id: daily_brief
version: 2
description: 三天天气（触发层预取）→ 知识库农事要点 → 一段能照做的建议

inputs:
  city:         { type: string, required: true,  description: 城市名（高德口径），如 阿克苏 }
  region:       { type: string, required: true,  description: 地区名，用于检索农事要点 }
  today:        { type: string, required: false, description: 触发日期（触发层注入） }
  weather_text: { type: string, required: true,  description: 今日/明日/后天各一行（触发层预取） }

nodes:
  # ① 农事要点：只读本地向量库
  - id: tips
    type: data.kb_query
    params:
      query: "{{region}} 棉花 田间管理 水肥调控 病虫害防治"
      top_k: 4
    side_effect: none

  # ② 成文：**只写农事建议**。天气那几行由触发层前置，模型不重复、不改写。
  - id: brief
    type: llm.summarize
    params:
      prompt_ref: prompts/daily_brief.md
      inputs: [tips]
      output_schema:
        body: string
    side_effect: network
    needs: [tips]