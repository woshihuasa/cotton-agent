<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
     viewBox="0 0 24 24" fill="none">
  <!-- 设置（齿轮）图标 —— 6 齿细线轮廓 + 中心孔

       ★ 为什么是 6 齿而不是 8 齿：实测在 18–22px 下，8 齿的齿距只有 1px 左右，
         缩略后有齿相互糊在一起（做过 6齿/8齿/8齿加粗 的对比图）。
         6 齿在同样尺寸下齿间留白更宽，轮廓更清楚。

       ★ 为什么用 SVG 而不是文字字符 "⚙"（原来就是这个）：
         字体字符会随字号被栅格化成点阵，16px 下边缘发虚。
         SVG 是矢量的，任意 DPI 都锐利。

       ★ 线宽 1.75 配合 22px 显示尺寸 ≈ 1.6 物理像素，属于"细线但不断"的观感。 -->
  <path d="M12.00 2.60 L14.43 2.92 L15.30 6.28 L16.67 7.33 L20.14 7.30 L21.08 9.57 L18.60 12.00 L18.38 13.71 L20.14 16.70 L18.65 18.65 L15.30 17.72 L13.71 18.38 L12.00 21.40 L9.57 21.08 L8.70 17.72 L7.33 16.67 L3.86 16.70 L2.92 14.43 L5.40 12.00 L5.62 10.29 L3.86 7.30 L5.35 5.35 L8.70 6.28 L10.29 5.62 Z"
        stroke="#5c6370" stroke-width="1.75"
        stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="12.0" cy="12.0" r="2.6"
          stroke="#5c6370" stroke-width="1.75"/>
</svg>
